<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rak Cerpen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=Newsreader:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* ============ 1. WARNA & FONT — ubah di sini ============ */
:root{
  --bg:#e9ecff;        /* latar halaman */
  --ink:#1d1b3a;       /* teks utama */
  --accent:#ff7a3d;    /* warna tombol */
  --accent-2:#6a3cff;  /* warna sorotan */
  --paper:#ffffff;     /* warna bingkai foto */
  --font-title:"Bricolage Grotesque",system-ui,sans-serif;
  --font-read:"Newsreader",Georgia,serif;
}
*{box-sizing:border-box;margin:0}
body{
  background:var(--bg);color:var(--ink);font-family:var(--font-read);
  min-height:100vh;padding:56px 20px 80px;
  background-image:radial-gradient(circle at 15% 10%,#d4d9ff 0,transparent 40%),
                   radial-gradient(circle at 90% 80%,#ffe0d0 0,transparent 35%);
}
header{max-width:760px;margin:0 auto 56px;text-align:center}
header h1{font-family:var(--font-title);font-weight:800;font-size:clamp(2.4rem,7vw,4.2rem);line-height:1;letter-spacing:-.03em}
header p{margin-top:14px;font-size:1.2rem;font-style:italic;opacity:.75}

/* ============ 2. KARTU CERPEN ============ */
.rak{max-width:1020px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:44px 32px}
.kartu{
  background:var(--paper);padding:14px 14px 22px;border-radius:6px;position:relative;
  box-shadow:0 14px 30px -12px rgba(29,27,58,.35);
  transform:rotate(var(--miring,0deg));transition:transform .35s cubic-bezier(.3,1.6,.5,1);
  display:flex;flex-direction:column;
}
.kartu:hover{transform:rotate(0) translateY(-8px) scale(1.02)}
.kartu::before{ /* selotip */
  content:"";position:absolute;top:-12px;left:50%;width:84px;height:24px;
  transform:translateX(-50%) rotate(-3deg);background:rgba(255,122,61,.55);
}
/* AREA GAMBAR ILUSTRASI */
.ilustrasi{
  aspect-ratio:4/3;border-radius:3px;overflow:hidden;position:relative;
  background:var(--warna);display:grid;place-items:center;
}
.ilustrasi img{width:100%;height:100%;object-fit:cover;display:block;position:absolute;inset:0}
.ilustrasi .emoji{font-size:4.5rem;filter:drop-shadow(0 6px 8px rgba(0,0,0,.25))}
.genre{
  position:absolute;left:8px;bottom:8px;z-index:1;font-family:var(--font-title);font-size:.8rem;
  background:var(--ink);color:#fff;padding:3px 10px;border-radius:99px;
}
.kartu h2{font-family:var(--font-title);font-size:1.45rem;line-height:1.15;margin:16px 4px 6px;letter-spacing:-.01em}
.kartu .sinopsis{font-size:1.02rem;line-height:1.45;margin:0 4px 18px;opacity:.8;flex:1}
.kartu .penulis{font-size:.9rem;margin:0 4px 12px;opacity:.6;font-style:italic}

/* TOMBOL MENUJU CERPEN */
.baca{
  font-family:var(--font-title);font-weight:800;font-size:1rem;cursor:pointer;text-decoration:none;text-align:center;
  background:var(--accent);color:#fff;border:0;border-radius:10px;padding:12px 18px;
  box-shadow:0 5px 0 #c24d17;transition:transform .12s,box-shadow .12s;
}
.baca:hover{transform:translateY(2px);box-shadow:0 3px 0 #c24d17}
.baca:active{transform:translateY(5px);box-shadow:0 0 0 #c24d17}
.baca:focus-visible,.tutup:focus-visible,.ukuran button:focus-visible{outline:3px solid var(--accent-2);outline-offset:3px}

/* ============ 3. PEMBACA CERPEN (jendela) ============ */
dialog{
  border:0;border-radius:18px;max-width:680px;width:calc(100% - 24px);max-height:90vh;
  padding:0;background:#fffdf8;color:var(--ink);box-shadow:0 30px 80px rgba(29,27,58,.5);
}
dialog::backdrop{background:rgba(29,27,58,.6);backdrop-filter:blur(4px)}
dialog[open]{animation:muncul .3s ease-out}
@keyframes muncul{from{opacity:0;transform:translateY(24px) scale(.97)}}
.sampul{height:170px;position:relative;background:var(--warna);display:grid;place-items:center}
.sampul img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sampul .emoji{font-size:5rem}
.isi{padding:26px 30px 34px;overflow-y:auto;max-height:calc(90vh - 170px)}
.isi h2{font-family:var(--font-title);font-size:1.9rem;line-height:1.1;margin-bottom:4px}
.isi .oleh{font-style:italic;opacity:.6;margin-bottom:20px}
.teks{font-size:var(--huruf,1.2rem);line-height:1.75;max-width:62ch}
.teks p{margin-bottom:1em;text-indent:1.4em}
.teks p:first-child{text-indent:0}
.teks p:first-child::first-letter{font-family:var(--font-title);font-weight:800;font-size:3.2em;float:left;line-height:.85;padding:6px 8px 0 0;color:var(--accent-2)}
.alat{position:absolute;top:12px;right:12px;display:flex;gap:8px;z-index:2}
.alat button{
  font-family:var(--font-title);font-weight:800;cursor:pointer;border:0;border-radius:99px;
  background:rgba(255,255,255,.92);color:var(--ink);min-width:38px;height:38px;padding:0 12px;
}
.alat button:hover{background:#fff;transform:scale(1.06)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header>
  <h1>Time for Ziyad</h1>
  <p>Pilih satu ilustrasi, lalu tekan tombolnya untuk masuk ke ceritanya.</p>
</header>

<main class="rak" id="rak"></main>

<dialog id="pembaca" aria-labelledby="judulBaca">
  <div class="sampul" id="sampul">
    <div class="alat">
      <button id="kecil" aria-label="Perkecil huruf">A−</button>
      <button id="besar" aria-label="Perbesar huruf">A+</button>
      <button id="tutup" aria-label="Tutup">✕</button>
    </div>
  </div>
  <div class="isi">
    <h2 id="judulBaca"></h2>
    <p class="oleh" id="olehBaca"></p>
    <div class="teks" id="teksBaca"></div>
  </div>
</dialog>

<script>
/* =====================================================
   4. DATA CERPEN — tambah / ubah / hapus di sini saja
   -----------------------------------------------------
   judul     : judul cerpen
   penulis   : nama penulis
   genre     : label kecil di atas gambar
   sinopsis  : ringkasan singkat di kartu
   gambar    : alamat file/URL ilustrasi, misal "gambar/hujan.jpg"
               (kosongkan "" agar muncul emoji + warna sebagai pengganti)
   emoji     : dipakai kalau gambar kosong
   warna     : warna latar area gambar
   url       : isi dengan halaman lain (misal "cerpen1.html") agar
               tombol berpindah halaman. Kosongkan "" untuk membaca
               langsung di jendela di bawah.
   isi       : teks cerpen; pisahkan paragraf dengan baris kosong
   ===================================================== */
const CERPEN = [
  {

    penulis: "Ulwan",

    isi: Setiap waktu aku pelajari dan aku renungkan, apakah rumus-rumus Matematika terlibat pada kehidupanku yang sekarang bahwa aku hanya seorang yang sedang kambuh dalam memikirkan jalan masa depanku. Seorang “aku” yang bernama Ziyad hanya memikirkan apa yang berulang pada dunia ini, aku begitu antusias untuk mengejar dunia yang padahal aku benci dengan kenyataan dunia ini. Begitu sangat mengesankan jika aku berhasil menaklukkan dunia ini, tetapi aku tidak tahu cara mainnya.

  Begitu dalam aku menyelami dunia, sampai-sampai aku menemukan rumus-rumus yang abstrak, tidak bisa diucapkan pada dua kalimat saja. Seperti berada di Isekai, aku harus menemukan pola yang dapat menjadi alat penakluk.

  Maka dari itu, aku, Ziyad hanya bisa menuntunmu pada kisah yang sederhana ini, nggak ada arti yang bisa kamu ambil begitu saja, kecuali kamu sudah mengalaminya.

  <h2>I</h2>

  Dentuman yang bertubi tubi dihasilkan oleh kaki yang berlari menuju sumber suara peluit, aku melamun memikirkan tujuanku yang abstrak sambil melihat mereka dari lantai dua gedung sekolah. Jika aku berada di posisi mereka aku juga bakal berlari menuju sumber suara itu, tapi aku bukanlah santri yang berada pada Masa Orientasi Santri (MOS) itu. “Aku berjanji mulai dari sekarang akan memulai proses ku seolah olah aku memulai seperti mereka, aku akan berjuang!!”, batinku untuk memotivasi diriku yang merasa kurang dalam mencapai target hafalan Al-Quran. Bel istirahat mulai berbunyi setelah aku menunggu dua menit sebelum bel berbunyi. Yap, persis seperti motivasiku itu, aku menarik paksa rantai tubuhku yang terjerat pada pintu kantin agar aku semangat menuju masjid yang kuanggap sepi, tenang ,dan nyaman untuk menghafal Al-Quran. Ternyata aku sesemangat itu dalam membuktikan wacana motivasi tadi, tidak seperti orang yang terjerat doom scrolling. Well… saat aku terbawa suasana mengaji, aku merasa sempurna dan rapi, atau aku mulai merasa disiplin dan sukses walau ternyata aku hanya baru memulai prosesku ini, aku menghafal ayat per ayat, membaca artinya hingga bel masuk berbunyi. Maklum untuk seorang yang bersemangat dalam kebaikan ini mulai ketagihan dalam berbuat kebaikan pada waktu luangnya, hal ini seperti yang banyak motivator katakan “motivasi pada diri sendiri untuk mengubah hidup akan berefek kuat pada awal dan membuat kita ber-mindset harus semangat esok nya”, dan mungkin ada lanjutan dari sang motivator itu tapi intinya aku senang sekarang bisa termotivasi untuk mengejar target.

  Hari yang melelahkan untuk hari Senin, setelah sholat dhuhur dan halaqoh (ngaji) siang,aku mulai merasakan berat puasa Senin-Kamis ini, tepatnya saat pulang ke asrama. Tapi seharusnya tak seberat ini, atau di hari Senin ini aku terlalu memeras tenagaku untuk banyak berpikir dan menghafal. Kasur yang sederhana, aku sudah tepat berada di sampingnya, tapi apalah daya kedisiplinanku ini memaksaku untuk harus berganti baju dahulu. Walau aku harus mencuci baju putih untuk hari Jum'at, aku hanya akan memilih untuk beristirahat sekarang. Badanku terasa seperti orang sakit dan agak gatal di bagian punggung “mungkin ini hanya efek minum sedikit air tawar waktu sahur tadi”, renungku supaya tidak terlalu overthinking.

  Tidur yang nyenyak, sedikit merasa demam saat bangun. Aku berusaha untuk melupakan capek ini. Turun dari ranjang, lalu persiapan sholat Ashar. Aku berjalan seperti orang yang demam sungguhan, aku harus bisa meneruskan proses mencapai harapan itu, ini bukan akhir dari semangat motivasi itu. Aku hanya harus sholat lalu lanjut mengaji di halaqoh sore ini “kan”, (tanya lembut penyemangat diri sendiri). Semua kelelahan itu berakhir, aku sekarang harus mandi lalu ke masjid dan mengaji sambil menunggu ifthar (buka puasa).

  “Benjolan di punggung”, heranku saat mengusap punggung karena gatal disaat aku mandi. Aku yang awalnya tak bertenaga tiba-tiba kaget dengan keadaan ini. Benjolan di punggung lalu merasa gatal, spontan membuat perasaanku ini campur aduk, aku yang sedikit mengerti keadaan ini, bahwa aku terkena cacar air. Aku nggak tahu pasti darimana aku tertular penyakit ini tapi ini bisa berdampak terhadap pikiranku saat ini.

  Keesokan harinya, aku tidak bisa berkompromi dengan cacar ini. Aku minta si Rafa (teman sekamarku) untuk menyampaikan perizinan ketidakhadiranku kepada sekolah dan penanggung jawab halaqohku. Akhirnya aku istirahat dengan tenang. Hal ini aku anggap sebagai peristirahatanku dari tekanan yang ada di pesantren ini.

  “Tapi mengapa, mengapa aku harus berhenti dalam proses pentingku ini, yang padahal dari proses tersebut aku masih merasa semangat dan termotivasi”, protesku untuk keadaan ini. Ya, walau aku tau ini semua adalah kehendakNya, mungkin ini baik bagiku. “Tapi kan, aku malah jadi nggak semangat lagi”. “Dan, buruknya lagi aku malah nggak bisa aktif selama dua pekan awal aku kelas delapan ini, dasar!”.

  <h2>II</h2>

  Setelah pengobatan cacar itu, aku merasa tertinggal. Dari awal aku terlalu melebih lebihkan bahwa aku tertinggal jauh dalam pelajaran sekolah dan target asrama (hafalan, dan lain lain). Ternyata itu tidak benar, apalah aku hanya tertinggal dua pekan, aku gampang mengkondisikan apapun itu. 

  Hari yang biasa saja, yang penting aku masih teringat motivasiku itu walau jarang. Seharusnya, jika aku sehat dan tidak cacar waktu itu mungkin aku bisa mencapai target dengan mudah. Tapi yang berlalu tetap berlalu, sekarang adalah masa pembangkitanku.

  Tetap saja, aku hanya wacana dalam motivasiku. Aku yang tiba tiba ingin serius, tidak tidur siang dengan menggantinya dengan ngaji, kejar target, bangun tahajud cepat, lalu kejar target, tiba-tiba setelah aku melakukannya baru satu hari, aku langsung terkena hal yang tidak mengenakkan, lalu aku berkata ”sebentar, ada masalah dan penderitaan, aku istirahat dulu dari keseriusan ini”, ya, siapa yang mau semangat berproses kalau ada yang menghalangi, itu membuatku hilang mood, nanti kan, tambah capek toh.

  Sampai kapan aku begini, aku tidak bersungguh-sungguh dan tidak mencapai batas kemampuanku dengan menyalahkan keadaan. Keadaan yang memiliki konteks penderitaan yang tidak bisa ditoleransi. Aku tau banyak orang yang mengalaminya, aku tau aku harus beradaptasi dengannya, tapi bagaikan generasi yang tidak pada tempatnya, ini semua bodo amat untuk dimaklumi.

  Aku sedang berada di penderitaan level tujuh, kalian pasti tau keadaanku ini seperti air tawar yang yang ber-ph netral. Setelah aku melaksanakan sholat isya’, aku berdzikir pada Yang Maha Mengetahui apapun itu keabstrakan hati makhluk hidupNya. Tepat disampingku ada Ustadz Rizal yang sehabis dzikirnya ia bertanya kepadaku, “gimana itu, angkatanmu?”. Entah pikiranku kemana saja, aku spontan menjawab, “Saya nggak tau lagi, hampir banyak petinggi, atau senior, atau guru-guru, atau ustadz-ustadz muda-tua itu menyindir angkatanku, apakah emang begitu parahnya. Aku sudah melakukan cara yang bisa kulakukan untuk mengembalikan nama baik angkatanku, tapi nggak di apresiasi, masih ada aja sindiran tak berkenan di hati, terus ada sedikit temanku yang masih baik-baik saja, tapi kasihan, terkena sindiran itu. Apakah aku bisa mengundur waktu lalu menjadi santri angkatan satu, dua, atau tiga yang kompak dalam kebaikan itu, mungkin niscaya aku bakal jadi Ulama’. Yaa, intinya bodo amatlah yang penting aku udah ngingetin mereka terutama kepada mereka yang nggak bener”. Dia pun menjawab jawabanku dengan kata-kata motivasi yang bahkan nggak membuat aku baik-baik saja, dia hanya makhluk yang tidak mengerti apa-apa. Walau aku perlu perhatian, kata-kata itu hanya berefek sementara.

    <h2>III</h2>

  Bahkan aku bingung harus membandingkan diriku dengan siapa. Aku 
Ditarik oleh dua harapan dari samping kanan dan kiri. Aku cuma harus melepas salah satu dari kedua tarikan itu. 

  Di hari yang panjang, hari Minggu yang sangat senggang, aku berbaring di ranjang. Membuatku merenung ringan. Aku dalam keadaan pilih memilih. Aku adalah seorang yang duduk di pojokan kota, banyak orang di sampingku, tapi aku nggak memerlukan mereka. Aku tahu orang orang nggak mungkin mau mendukungku, kecuali beberapa saja. Lagi pula aku nggak butuh didukung. Di pojok tersebut, aku ingin memilih masa depanku yang bebas dari penderitaan yang tidak bisa ditoleransi. Aku nggak sama sekali berpikir bagaimana keadaanku saat meninggalkan status santriku selamanya. Aku ingin jadi siswa negri setelah tiga tahun ini. Tetapi… apa yang bakal dibilang kerabatku, temanku sekarang, orang orang yang aku kenal kepadaku. “Aku merasa bangga, orang yang paling baik diantara teman angkatanku akan masuk sekolah negeri daripada lanjut mondok lagi, aku akan dianggap mendakwah”, cakap pikiran sombongku.

  Ya, ya, ya, “Ziyad, apakah kamu yakin”, begitulah  sosok petinggi pesantren menjawab kesombonganku dalam berharap. Memang dalam pikiranku sudah banyak harapan baik ketika aku akan masuk SMA Negri nanti, tapi cuma harapan. Sudah, kuputuskan akan kemana jalanku nantinya. Aku hanya perlu menunggu dan berusaha di akhir-akhir masa MTs ku.

  <h2>IV</h2>

  Banyak hal yang berlalu, dan akhirnya aku diterima di sekolah negeri itu. Aku hanya perlu senang dengan pencapaian kecil ini, yang berhasil bersaing dengan 150  calon murid. 

  Aku sudah berharap akan memiliki komunitas yang tidak bobrok, dan aku mendapatkannya. Aku sudah berharap punya angkatan yang lebih baik dari sebelumnya, dan aku mendapatkannya. Tapi.. aku juga tidak luput dengan turunnya penderitaan padaku, rasa penderitaan ini sedikit persis dengan saat aku di pesantren. Justru itu yang aku inginkan, pengurangan dari kekhawatiran atas penderitaan. Aku hanya perlu memulai dari awal dengan penderitaan, seperti aku memulai hidupku dari awal - dari bayi yang menyengsarakan.

  Tidak dengan ketenangan lingkungan pondok itu lagi, dan juga rasa penyesalan ini, karena telah melepasnya dari jati diriku. Aku mengerti  setiap ruang dan waktu akan ada penderitaan yang tidak disangka-sangka dari Yang Maha Mengerti Setiap Isi Hati MakhlukNya, tapi aku selalu mengkhawatirkan keadaanku ini. Aku yang khawatir atas masa depan ini, bingung dengan masa depan ini, seakan akan menghancurkan semuanya, semuanya hancur, sampai kendali diriku memperbaiki keadaan ini.

/* =====================================================
   5. MESIN HALAMAN — biasanya tidak perlu diubah
   ===================================================== */
const rak = document.getElementById('rak');
const pembaca = document.getElementById('pembaca');
const miring = [-2.5, 1.8, -1.2, 2.4, -1.8, 1.2]; // sudut kemiringan tiap kartu

function gambarHTML(c){
  const img = c.gambar ? `<img src="${c.gambar}" alt="Ilustrasi cerpen ${c.judul}" onerror="this.remove()">` : '';
  return img + `<span class="emoji" aria-hidden="true">${c.emoji || '📖'}</span>`;
}

CERPEN.forEach((c, i) => {
  const el = document.createElement('article');
  el.className = 'kartu';
  el.style.setProperty('--miring', miring[i % miring.length] + 'deg');
  el.style.setProperty('--warna', c.warna);
  el.innerHTML = `
    <div class="ilustrasi">${gambarHTML(c)}<span class="genre">${c.genre}</span></div>
    <h2>${c.judul}</h2>
    <p class="penulis">oleh ${c.penulis}</p>
    <p class="sinopsis">${c.sinopsis}</p>
    ${c.url
      ? `<a class="baca" href="${c.url}">Baca cerpen</a>`
      : `<button class="baca" data-i="${i}">Baca cerpen</button>`}`;
  rak.appendChild(el);
});

rak.addEventListener('click', e => {
  const b = e.target.closest('button[data-i]');
  if(!b) return;
  const c = CERPEN[b.dataset.i];
  const sampul = document.getElementById('sampul');
  sampul.style.setProperty('--warna', c.warna);
  sampul.querySelectorAll('img,.emoji').forEach(n => n.remove());
  sampul.insertAdjacentHTML('afterbegin', gambarHTML(c));
  document.getElementById('judulBaca').textContent = c.judul;
  document.getElementById('olehBaca').textContent = 'oleh ' + c.penulis;
  document.getElementById('teksBaca').innerHTML =
    c.isi.trim().split(/\n\s*\n/).map(p => `<p>${p.trim()}</p>`).join('');
  pembaca.querySelector('.isi').scrollTop = 0;
  pembaca.showModal();
});

document.getElementById('tutup').onclick = () => pembaca.close();
pembaca.addEventListener('click', e => { if(e.target === pembaca) pembaca.close(); });

let ukuran = 1.2;
function atur(d){
  ukuran = Math.min(1.8, Math.max(.9, ukuran + d));
  pembaca.style.setProperty('--huruf', ukuran + 'rem');
}
document.getElementById('besar').onclick = () => atur(.1);
document.getElementById('kecil').onclick = () => atur(-.1);
</script>
</body>
